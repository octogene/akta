site_name: akta
site_description: A small saga engine for Kotlin services that call external systems, with state in PostgreSQL.
copyright: akta documentation

theme:
  name: material
  language: en
  icon:
    logo: material/transit-connection-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Your first saga: getting-started/first-saga.md
      - Running sagas: getting-started/running.md
      - Testing: getting-started/testing.md
  - Use cases:
      - use-cases/index.md
      - Setting up an item in two systems: use-cases/item-setup.md
      - A reservation that waits for a payment: use-cases/reservation-payment.md
      - Services with idempotency keys: use-cases/idempotent-services.md
  - Guides:
      - Clean architecture with Ktor: guides/clean-architecture.md
  - How it works:
      - how-it-works/index.md
      - Saga lifecycle: how-it-works/lifecycle.md
      - The step cycle: how-it-works/step-cycle.md
      - Unknown outcomes: how-it-works/unknown-outcomes.md
      - Compensation: how-it-works/compensation.md
      - Signals and cancellation: how-it-works/signals.md
      - Recovery and concurrency: how-it-works/recovery.md
      - Saga data: how-it-works/saga-data.md
      - Guarantees and limits: how-it-works/guarantees.md
  - Operations:
      - operations/index.md
      - Stuck sagas: operations/stuck-sagas.md
      - Observability: operations/observability.md
      - Configuration: operations/configuration.md
  - Reference:
      - reference/index.md
      - Events: reference/events.md
      - Database schema: reference/schema.md
